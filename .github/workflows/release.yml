# What TreeAlarm VMS's standalone installs take mt_admin from (../ta_install): the image
# treealarm/mt_admin for the Docker deployment, and the asset mt_admin-windows-x64.zip of the
# `windows-build` prerelease for the Windows installer. Both are rolling builds of main, replaced by
# every push that touches mt_admin; there they run as one realm's user list (MT_ADMIN_REALM).
name: release

on:
  push:
    branches: [main]
    paths:
      - mt_admin/**
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: mt_admin
          file: mt_admin/mt_admin.Server/Dockerfile
          push: true
          tags: |
            treealarm/mt_admin:latest
            treealarm/mt_admin:${{ github.sha }}

  windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the windows-build prerelease: create it, replace its asset
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Framework-dependent, like the TreeAlarm VMS services beside it: the installer brings the
      # ASP.NET Core runtime. Publishing the server builds the SPA into its wwwroot.
      - name: Publish
        run: |
          dotnet publish mt_admin/mt_admin.Server/mt_admin.Server.csproj -c Release -r win-x64 \
            --self-contained false --nologo -o out/mt_admin
          test -f out/mt_admin/mt_admin.Server.exe
          test -f out/mt_admin/wwwroot/index.html
          (cd out && zip -qr ../mt_admin-windows-x64.zip mt_admin)

      - name: Publish the build for ta_install
        run: |
          notes="Not a release. The Windows build of main at $GITHUB_SHA, replaced by every push; ta_install's Windows installer is built from it."
          if gh release view windows-build >/dev/null 2>&1; then
            gh release upload windows-build mt_admin-windows-x64.zip --clobber
            gh release edit windows-build --notes "$notes"
          else
            gh release create windows-build mt_admin-windows-x64.zip --prerelease --target "$GITHUB_SHA" \
              --title 'Windows build of main' --notes "$notes"
          fi
